{
  "name": "Dnevni backup",
  "on": { "schedule": [{ "cron": "30 2 * * *" }], "workflow_dispatch": {} },
  "jobs": {
    "backup": {
      "runs-on": "ubuntu-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "actions/setup-node@v4", "with": { "node-version": 20 } },
        { "run": "npm ci" },
        { "run": "node scripts/backup.mjs", "env": {
            "VITE_SUPABASE_URL": "${{ secrets.VITE_SUPABASE_URL }}",
            "VITE_SUPABASE_ANON_KEY": "${{ secrets.VITE_SUPABASE_ANON_KEY }}",
            "BACKUP_PIN": "${{ secrets.BACKUP_PIN }}" } },
        { "uses": "actions/upload-artifact@v4", "with": { "name": "backup-${{ github.run_number }}", "path": "backup/", "retention-days": 90 } }
      ]
    }
  }
}
